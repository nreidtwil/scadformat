name: Test Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'

    - name: Install ANTLR
      run: pip install antlr4-tools

    - name: Build and Test
      env:
        # Pin the ANTLR version so antlr4-tools doesn't need to query
        # Maven Central for the "latest" version at build time. That
        # lookup uses the deprecated Sonatype Nexus2 search API, which
        # can return errors and break CI on a cold cache.
        ANTLR4_TOOLS_ANTLR_VERSION: "4.13.2"
      run: make